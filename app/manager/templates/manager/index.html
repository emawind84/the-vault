{% extends "manager/base.html" %}
{% load icons %}

{% block content %}
<div class="page--narrow center">
  <h1 class="mb-2">Hello, {{ user.username }}.</h1>
  <p class="text-muted mb-5">Manage your credentials securely with The Vault.</p>

  <div class="row-actions row-actions--center">
    <a href="{% url 'users:edit_user' %}" class="btn btn-secondary">{% icon 'user' %} My information</a>
    {% if user.password %}
    <a href="{% url 'users:password_change' %}" class="btn btn-secondary">{% icon 'lock' %} Change my password</a>
    {% endif %}
  </div>

  <a class="btn btn-primary btn-fab" href="{% url 'manager:new_secret' %}" aria-label="Add a new secret">
    {% icon 'plus' %}
  </a>
</div>
{% endblock content %}
